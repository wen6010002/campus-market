# 生产部署（docker compose）。TLS 由 Caddy 自动签发。
# 用法：docker compose -f docker/docker-compose.prod.yml up -d
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cm-app
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cm}:${POSTGRES_PASSWORD:-cm}@postgres:5432/${POSTGRES_DB:-campus_market}
      # 单机测试环境直接连 PostgreSQL，避免 Prisma 与 PgBouncer 的事务池兼容问题。
      DATABASE_URL_POOLED: postgresql://${POSTGRES_USER:-cm}:${POSTGRES_PASSWORD:-cm}@postgres:5432/${POSTGRES_DB:-campus_market}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    container_name: cm-worker
    restart: unless-stopped
    env_file: ../.env
    command: ["node", "node_modules/tsx/dist/cli.mjs", "src/server/jobs/scheduler.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cm}:${POSTGRES_PASSWORD:-cm}@postgres:5432/${POSTGRES_DB:-campus_market}
      DATABASE_URL_POOLED: postgresql://${POSTGRES_USER:-cm}:${POSTGRES_PASSWORD:-cm}@postgres:5432/${POSTGRES_DB:-campus_market}
      REDIS_URL: redis://redis:6379
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: cm-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-cm}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cm}
      DB_NAME: ${POSTGRES_DB:-campus_market}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432", "-U", "${POSTGRES_USER:-cm}", "-d", "${POSTGRES_DB:-campus_market}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: cm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cm}
      POSTGRES_DB: ${POSTGRES_DB:-campus_market}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cm} -d ${POSTGRES_DB:-campus_market}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: cm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: cm-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app

  backup:
    image: postgres:16-alpine
    container_name: cm-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-cm}
    volumes:
      - backups:/backups
    entrypoint: >
      /bin/sh -c "while true; do
        pg_dump -h postgres -U ${POSTGRES_USER:-cm} -d ${POSTGRES_DB:-campus_market} -F c -f /backups/cm_\$(date +%Y%m%d_%H%M%S).dump;
        ls -t /backups | tail -n +8 | xargs -r -I{} rm /backups/{};
        sleep 86400;
      done"

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
  backups:
