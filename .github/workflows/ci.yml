name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cm
          POSTGRES_PASSWORD: cm
          POSTGRES_DB: campus_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma:generate

      - run: pnpm lint

      - run: pnpm typecheck

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://cm:cm@localhost:5432/campus_market_test
          DATABASE_URL_TEST: postgresql://cm:cm@localhost:5432/campus_market_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: test-secret-32-bytes-minimum-length
          PASSWORD_PEPPER: test-pepper
          PAYMENT_MODE: mock
